let autoAdvance=null;
function speedElapsed(g,now=performance.now()){const waiting=g.autoPauseStarted==null?0:Math.max(0,now-g.autoPauseStarted);return Math.max(0,(now-g.started-(g.autoPauseMs||0)-waiting)/1000);}
function cancelAutoAdvance(){const pending=autoAdvance;autoAdvance=null;if(pending){clearTimeout(pending.delayTimer);clearTimeout(pending.capTimer);clearTimeout(pending.startTimer);const g=pending.session;if(g.autoPauseStarted!=null){g.autoPauseMs=(g.autoPauseMs||0)+Math.max(0,performance.now()-g.autoPauseStarted);g.autoPauseStarted=null;}}const button=$('#nextQuestion');if(button){button.classList.remove('auto-waiting','auto-countdown');button.style.removeProperty('--auto-ms');button.removeAttribute('aria-label');button.removeAttribute('title');}}
function armAutoAdvance(response,feedbackAt){cancelAutoAdvance();const g=game;if(!g||g.finished||!g.locked||screen!=='play')return;const pending={session:g,fact:g.current,feedbackAt,delayTimer:null,capTimer:null,startTimer:null,dueAt:null};autoAdvance=pending;const valid=()=>autoAdvance===pending&&game===g&&g.current===pending.fact&&g.locked&&!g.finished&&screen==='play';const advance=()=>{if(!valid())return;if($('#modalRoot').innerHTML){cancelAutoAdvance();return;}nextQuestion();};const schedule=deadline=>{if(!valid())return;clearTimeout(pending.delayTimer);pending.dueAt=Math.min(deadline,feedbackAt+(g.speed?800:8000));const ms=Math.max(0,pending.dueAt-performance.now()),button=$('#nextQuestion');button.classList.remove('auto-waiting','auto-countdown');button.style.setProperty('--auto-ms',ms+'ms');void button.offsetWidth;button.classList.add('auto-countdown');button.setAttribute('aria-label',(g.queue.length?'Next fact':'See my results')+', continuing automatically. Tap or press Enter to skip the wait.');button.title='Continuing automatically · tap or press Enter now';pending.delayTimer=setTimeout(advance,ms);};
if(g.speed){if(!g.completedAt)g.autoPauseStarted=feedbackAt;schedule(feedbackAt+800);return;}
pending.capTimer=setTimeout(advance,Math.max(0,feedbackAt+8000-performance.now()));
if(!response||!save.voice||response.status==='silent'||response.status==='failed'||response.status==='cancelled'){schedule(feedbackAt+2000);return;}
const button=$('#nextQuestion');button.classList.add('auto-waiting');button.setAttribute('aria-label','Next fact, waiting for the tutor, then continuing automatically. Tap or press Enter to skip.');button.title='Waiting for this response · tap or press Enter to skip';
// Browsers which never start speaking fall back to two seconds from feedback.
pending.startTimer=setTimeout(()=>{if(valid()&&!response.started&&!window.speechSynthesis?.speaking&&response.status==='pending')advance();},Math.max(0,feedbackAt+2000-performance.now()));
response.done.then(status=>{if(!valid())return;clearTimeout(pending.startTimer);schedule(status==='ended'?performance.now()+2000:feedbackAt+2000);});
}

// Level engine: first attempts determine mastery; comeback rounds never inflate it.
function allFacts(id,i){const g=modules[id].groups[i],out=[];for(let a=0;a<=12;a++)for(let b=0;b<=12;b++){let keep=false;if(id==='add')keep=Array.isArray(g)?g.includes(b):g==='doubles'?(a===b||a+b===10):true;if(id==='sub')keep=a>=b&&(Array.isArray(g)?g.includes(b):g==='near'?a-b<=2:true);if(id==='mul')keep=Array.isArray(g)?g.includes(b):true;if(id==='div')keep=b>=1&&(Array.isArray(g)?g.includes(b):true);if(keep){const x=id==='div'?a*b:a,answer=id==='add'?a+b:id==='sub'?a-b:id==='mul'?a*b:a;out.push({a:x,b,answer,key:`${x} ${modules[id].symbol} ${b}`});}}return out;}
function leavePlay(){cancelAutoAdvance();clearInterval(timerHandle);stopIdle();stopListening();cancelSpeech();game=null;}
function navigate(where,id){cancelAutoAdvance();if(game&&!game.finished){confirmModal('Leave this level?','Your LeviBucks and practice stats are saved, but this level will restart next time.',()=>{leavePlay();show(where,id);},'Leave level');return;}leavePlay();show(where,id);}
function show(where,id){cancelAutoAdvance();screen=where;if(where!=='play')stopIdle();document.body.classList.toggle('playing',where==='play');if(id)selectedModule=id;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===where||where==='levels'&&b.dataset.nav==='home'));const renderers={home:renderHome,levels:renderLevels,play:renderPlay,finish:renderFinish,trophies:renderTrophies,editor:renderEditor,shop:renderShop};$('#main').innerHTML=renderers[where]();bindScreen();if(where!=='play')window.scrollTo(0,0);}
function startLevel(i){const id=selectedModule;if(i>save.modules[id].unlocked)return;leavePlay();$('#confetti').innerHTML='';$('#toast').classList.add('hidden');const pool=shuffled(allFacts(id,i)),facts=Array.from({length:12},(_,n)=>({...pool[n%pool.length],original:true}));game={id,level:i,queue:facts,current:null,originalsDone:0,firstCorrect:0,streak:save.questStreak||0,maxStreak:0,questionSerial:0,urgencyFlags:[],attempt:0,earned:0,startBalance:save.balance,started:performance.now(),autoPauseMs:0,autoPauseStarted:null,answerSeconds:0,resolved:0,finished:false,locked:false,speed:i>=8,limit:i===8?120:90};show('play');window.scrollTo(0,0);nextQuestion();say(line('intro')+' '+(i>=8?`Speed quest: ${game.limit} seconds. Accuracy first!`:'Twelve facts, no timer. Let’s explore!'));if(game.speed){timerHandle=setInterval(updateTimer,200);updateTimer();}}
function nextQuestion(){if(!game||game.finished)return;cancelAutoAdvance();stopListening();if(!game.queue.length){finishLevel(false);return;}game.current=game.queue.shift();game.attempt=0;game.locked=false;game.factStarted=performance.now();game.questionSerial++;if(game.originalsDone>0){const category=!game.current.original?'comeback':game.originalsDone===10&&!game.nearAnnounced?'near':'intro';if(category==='near')game.nearAnnounced=true;chatter(category,{},'',!game.speed&&(category!=='intro'||game.questionSerial%4===0));}$('#question').textContent=game.current.key+' = ?';$('#questionLabel').textContent=game.current.original?'YOUR NEXT LITTLE VICTORY':'PRACTICE COMEBACK · YOU’VE GOT THIS';$('#feedback').textContent=cardPrompt();$('#feedback').className='feedback';$('#answer').value='';$('#answer').disabled=false;$('#checkAnswer').disabled=false;$('#nextQuestion').classList.add('hidden');$('.answer-row').classList.remove('has-next');document.querySelectorAll('[data-key]').forEach(b=>b.disabled=false);updatePlayProgress();if(matchMedia('(min-width:900px)').matches)$('#answer').focus();updateMicUI();scheduleIdle();}
function updatePlayProgress(){if(!game||screen!=='play')return;$('#progressFill').style.width=game.originalsDone/12*100+'%';$('#progressText').textContent=game.originalsDone+' / 12 facts explored'+(!game.current?.original?' · comeback round':'');$('#accuracyText').textContent=game.firstCorrect+' / 10 first-try wins';$('#streak').textContent='✦ '+game.streak+' streak';}
function strategy(f,id,reveal){return factStrategy(f,id,reveal);}
function submitAnswer(){if(!game||game.finished||game.locked)return;if(game.speed&&speedElapsed(game)>=game.limit){finishLevel(true);return;}const el=$('#answer'),raw=el.value.trim();if(!/^\d{1,3}$/.test(raw)){toast('Pop a whole number in the answer box first.');return;}stopIdle();stopListening();const val=Number(raw),f=game.current,first=game.attempt===0;
if(val===f.answer){const feedbackAt=performance.now();const gain=first?2:1;money(gain);game.earned+=gain;game.streak++;save.questStreak=game.streak;game.maxStreak=Math.max(game.maxStreak,game.streak);if(first&&f.original)game.firstCorrect++;$('#feedback').textContent=line(first?'cardCorrect':'cardRescue')+(first?' +2 LeviBucks':' +1 LeviBuck');$('#feedback').className='feedback';const streakCategory=game.streak>=15&&game.streak%5===0?'streak15':game.streak===10?'streak10':game.streak===5?'streak5':game.streak===3?'streak3':null;let praise=line(streakCategory||(first?'correct':'rescue'));if(first&&!streakCategory&&Math.random()<.18)praise+=' '+factSpark(f,game.id);const responseSpeech=say(praise,'success',!!streakCategory||!first||Math.random()<(game.speed ? .35 : .75));sound('correct');resolveFact(first);armAutoAdvance(responseSpeech,feedbackAt);}
else{money(-1);game.earned--;game.streak=0;save.questStreak=0;persist();sound('wrong');$('#feedback').className='feedback bad';if(first){game.attempt=1;$('#feedback').textContent=line('wrong')+' −1 LeviBuck · second chance!';say(line('wrong')+` ${val} isn’t the answer to ${f.key}. ${strategy(f,game.id,false)}`,'error');el.value='';if(matchMedia('(min-width:900px)').matches)el.focus();scheduleIdle();}else{$('#feedback').textContent=`The answer is ${f.answer}. We’ll practice this one again.`;say(line('wrongTwice')+' '+strategy(f,game.id,true),'error');game.queue.push({...f,original:false});resolveFact(false);}}updatePlayProgress();}
function resolveFact(firstRight){stopIdle();const g=game,f=g.current;g.locked=true;const secs=(performance.now()-g.factStarted)/1000;if(f.original){g.originalsDone++;g.resolved++;g.answerSeconds+=secs;const st=save.modules[g.id].stats;st.seen++;st.firstCorrect+=firstRight?1:0;st.seconds+=secs;const fs=st.facts[f.key]||{seen:0,correct:0,seconds:0,answer:f.answer};fs.seen++;fs.correct+=firstRight?1:0;fs.seconds+=secs;st.facts[f.key]=fs;}
const p=save.modules[g.id];if(g.maxStreak>=5&&!p.badges.includes('streak5')){p.badges.push('streak5');toast('Badge earned: High-five streak!');}if(g.maxStreak>=10&&!p.badges.includes('streak10')){p.badges.push('streak10');toast('Badge earned: Tenacious ten!');}if(!g.queue.length&&g.originalsDone===12){g.completedAt=performance.now();clearInterval(timerHandle);if($('#timer'))$('#timer').textContent='Finished!';}persist();$('#answer').disabled=true;$('#checkAnswer').disabled=true;document.querySelectorAll('[data-key]').forEach(b=>b.disabled=true);$('#nextQuestion').classList.remove('hidden');$('#nextLabel').textContent=g.queue.length?'Next fact →':'See results ✦';$('.answer-row').classList.add('has-next');updateMicUI();$('#nextQuestion').focus();}
function updateTimer(){if(!game||game.finished||game.completedAt)return;const left=Math.max(0,game.limit-speedElapsed(game)),el=$('#timer');if(el){el.textContent=Math.ceil(left)+'s left';el.classList.toggle('urgent',left<=20);}if(left<=0){finishLevel(true);return;}for(const threshold of[8,20])if(left<=threshold&&!game.urgencyFlags.includes(threshold)&&!game.locked&&game.attempt===0&&!listening){game.urgencyFlags.push(...[20,8].filter(t=>t>=threshold));chatter('urgency',{seconds:Math.ceil(left)});break;}}
function finishLevel(timedOut){if(!game||game.finished)return;cancelAutoAdvance();clearInterval(timerHandle);stopIdle();stopListening();game.finished=true;const g=game,p=save.modules[g.id],accuracy=Math.round(g.firstCorrect/12*100),passed=!timedOut&&g.originalsDone===12&&g.queue.length===0&&g.firstCorrect>=10,elapsed=g.speed?speedElapsed(g,g.completedAt||performance.now()):((g.completedAt||performance.now())-g.started)/1000,avg=g.resolved?g.answerSeconds/g.resolved:0,newTrophy=passed&&!p.completed.includes(g.level),previous=p.results[g.level];let speedRecord=false;
if(passed){if(newTrophy){p.completed.push(g.level);p.completed.sort((a,b)=>a-b);p.unlocked=Math.min(9,Math.max(p.unlocked,g.level+1));}if(g.firstCorrect===12&&!p.badges.includes('perfect'))p.badges.push('perfect');if(g.speed&&(!previous?.speedBest||elapsed<previous.speedBest)){speedRecord=true;if(!p.badges.includes('speed'))p.badges.push('speed');}p.results[g.level]={accuracy:Math.max(previous?.accuracy||0,accuracy),avg:previous?Math.min(previous.avg,avg):avg,speedBest:g.speed?Math.min(previous?.speedBest||Infinity,elapsed):null};}
lastResult={id:g.id,level:g.level,passed,timedOut,newTrophy,speedRecord,accuracy,avg,firstCorrect:g.firstCorrect,earned:save.balance-g.startBalance,elapsed,done:g.originalsDone};persist();show('finish');if(passed){celebrate();sound('win');say(line('pass')+(newTrophy?' '+line('trophy',{trophy:tier(g.level)}):''),'success');}else say((timedOut?'Time’s up for this round. ':'')+line('fail'));}
function celebrate(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;$('#confetti').innerHTML=Array.from({length:65},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#d8f578','#b8a2e8','#ffad70','#86d7d4'][i%4]};animation-delay:${Math.random()*.8}s;--drift:${Math.random()*260-130}px;transform:rotate(${Math.random()*360}deg)"></i>`).join('');setTimeout(()=>$('#confetti').innerHTML='',3900);}

function renderHome(){return`<div class="welcome-line row between"><span class="eyebrow muted">The adventure / Base camp</span><span class="pill">✦ ${totalMastered()} / 40 levels mastered</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">Small steps. Super powers.</div><h1>Hey ${esc(save.name||'Levi')},<br>let’s level up.</h1><p>Four worlds to explore. A pocket full of possibility. Your next math adventure starts here.</p></div>${heroArt()}</section><div class="section-head row between"><h2>Choose your world</h2><span class="small muted">Go at your own pace</span></div><div class="module-grid">${moduleIds.map(id=>{const m=modules[id],n=mastery(id);return`<article class="module-card" style="--tint:${m.color}"><div class="symbol">${m.symbol}</div><span class="pill">${n===10?'All mastered!':n+' / 10 levels'}</span><h3>${m.name}</h3><p>${m.desc}</p><div class="mini-progress"><i style="width:${n*10}%"></i></div><div class="small muted">${rank(id)}</div><button class="btn" data-world="${id}">${n?'Continue quest':'Start exploring'}<span>↗</span></button></article>`;}).join('')}</div><p class="bottom-note">✦ No rush, no pressure. The first 8 levels in every world are untimed.<br>Earn LeviBucks, unlock tutor gear, and turn practice into a superpower.</p>`;}
function groupDescription(id,i){const g=modules[id].groups[i];if(i>=8)return`${i===8?120:90}-second challenge · mixed facts`;if(g==='doubles')return'Doubles & make-ten combinations';if(g==='near')return'Same-number & neighbor differences';if(g==='mixed')return'All facts from 0–12';if(id==='sub')return'Take away '+g.join(', ')+' · no negative answers';if(id==='div')return'Divide by '+g.join(', ')+' · whole-number answers';return(id==='mul'?'Tables ':'Add ')+g.join(', ');}
function moduleStats(id){const s=save.modules[id].stats;return`<div class="stats-row"><div class="stat"><strong>${s.seen?Math.round(s.firstCorrect/s.seen*100)+'%':'—'}</strong><span>FIRST-TRY ACCURACY</span></div><div class="stat"><strong>${s.seen?(s.seconds/s.seen).toFixed(1)+'s':'—'}</strong><span>AVERAGE / FACT</span></div><div class="stat"><strong>${s.seen}</strong><span>FACTS PRACTICED</span></div></div>`;}
function renderLevels(){const id=selectedModule,m=modules[id],p=save.modules[id];return`<button class="back" data-back="home">← All worlds</button><div class="page-heading"><span class="eyebrow muted">${m.world}</span><h1>${m.name} quest</h1><p>Every level is a new adventure. Your rank: <strong>${rank(id)}</strong>.</p></div>${moduleStats(id)}<div class="rule"><strong>The quest code:</strong> 12 facts. Get at least 10 right on the first try to unlock the next level. Mistakes are practice, not a dead end.<br>First try <strong>+2 L</strong> · each wrong try <strong>−1 L</strong> · second-try rescue <strong>+1 L</strong>. Balance stops at zero.</div><div class="levels">${m.names.map((name,i)=>{const done=p.completed.includes(i),locked=i>p.unlocked,r=p.results[i];return`<article class="level ${locked?'locked':''}" style="--tint:${m.color}"><div class="level-num">${done?'✓':locked?'◇':String(i+1).padStart(2,'0')}</div><div><h3>${name}${i>=8?' · Speed':''}</h3><div class="small">${groupDescription(id,i)}${r?`<br>Best: ${r.accuracy}% first try · ${r.avg.toFixed(1)}s / fact`:''}</div></div><button class="btn ${done?'soft':''}" data-level="${i}" ${locked?'disabled':''}>${locked?'Locked':done?'Play again':'Let’s go →'}</button></article>`;}).join('')}</div>${weakest(id)}`;}
function weakest(id){const facts=Object.entries(save.modules[id].stats.facts).sort((a,b)=>{const x=a[1],y=b[1];return x.correct/x.seen-y.correct/y.seen||y.seconds/y.seen-x.seconds/x.seen;}).slice(0,5);return`<div class="weak-list"><h3>Your practice targets</h3><p class="small muted">Lowest first-try accuracy, then slowest answers. Every retry builds a stronger brain.</p>${facts.length?facts.map(([key,f])=>`<div class="weak-fact"><strong>${esc(key)} = ${f.answer}</strong><span>${Math.round(f.correct/f.seen*100)}% · ${(f.seconds/f.seen).toFixed(1)}s · ${f.seen} seen</span></div>`).join(''):'<p class="small muted" style="margin-top:12px">Play a level to discover your strengths and practice targets.</p>'}</div>`;}
function renderPlay(){const m=modules[game.id];return`<div class="play-top"><div class="row between"><button class="back" id="exitLevel">← Leave level</button><div class="row wrap"><span class="pill streak" id="streak">✦ 0 streak</span>${game.speed?`<span class="pill timer" id="timer" role="timer">${game.limit}s</span>`:'<span class="pill">Untimed · take your time</span>'}</div></div><div class="row between"><h2>${m.names[game.level]}</h2><span class="small muted">${m.name} · Level ${game.level+1}</span></div><div class="level-progress"><div id="progressFill" style="width:0%"></div></div><div class="row between small muted"><span id="progressText">0 / 12 facts explored</span><span id="accuracyText">Goal: 10 first-try wins</span></div></div><section class="question-card"><div class="eyebrow muted" id="questionLabel">YOUR NEXT LITTLE VICTORY</div><div class="question" id="question" aria-live="polite"></div><form id="answerForm" autocomplete="off"><label class="sr-only" for="answer">Your answer</label><div class="answer-row"><input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Your answer"><button class="btn" id="checkAnswer" type="submit">Check ↗</button><button class="btn soft next-action hidden" id="nextQuestion" type="button"><span id="nextLabel">Next fact →</span><span class="auto-progress" aria-hidden="true"><i></i></span></button></div></form><div class="feedback" id="feedback" aria-live="polite">Type an answer or tap the numbers below.</div><div class="keypad" aria-label="Number pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-key="${n}">${n}</button>`).join('')}<button type="button" class="minor" data-key="clear">Clear</button><button type="button" data-key="0">0</button><button type="button" data-key="back" aria-label="Backspace">⌫</button></div><button class="btn outline hidden" id="listenBtn" style="margin-top:12px">◎ Speak my answer</button><div class="scoring"><span>First try: +2 L</span><span>Second try: +1 L</span><span>Wrong try: −1 L</span></div></section><p class="bottom-note">${game.speed?'Correct answers roll on after a short pause; that automatic pause doesn’t use your countdown. After a revealed answer, tap Next or press Enter when ready.':'Correct answers roll on after your tutor, then a little pause. Tap Next or press Enter to skip the wait. After two misses, take your time and choose Next yourself.'}</p>`;}
function renderFinish(){const r=lastResult,m=modules[r.id];return`<section class="finish"><div class="eyebrow muted">${m.name} · Level ${r.level+1}</div><div class="big-trophy">${trophySVG(r.level,!r.passed)}</div><span class="pill ${r.passed?'coin':''}">${r.passed?'QUEST COMPLETE':'A LITTLE MORE PRACTICE'}</span><h1>${r.passed?'Look at you go!':r.timedOut?'A brave speed run!':'Your next win is coming.'}</h1><p>${r.passed?`<strong>${esc(m.names[r.level])}</strong> is mastered. That’s something to be proud of.`:`${r.firstCorrect} of 12 first-try wins. Get at least 10 and finish ${r.timedOut?'before the countdown ends':'the comeback facts'} to master this level.`}</p><div class="stats-row"><div class="stat"><strong>${r.accuracy}%</strong><span>FIRST-TRY ACCURACY</span></div><div class="stat"><strong>${r.avg.toFixed(1)}s</strong><span>AVERAGE / FACT</span></div><div class="stat"><strong>${r.earned>=0?'+':''}${r.earned} L</strong><span>LEVIBUCKS EARNED</span></div></div>${r.passed?`<div class="prize-banner"><strong>✦ ${r.newTrophy?'New treasure!':'Another victory!'}</strong><p style="margin-top:6px">${r.newTrophy?tier(r.level)+' '+m.names[r.level]+' trophy added. ':''}Rank: <strong>${rank(r.id)}</strong>${r.speedRecord?'<br>New speed record! Lightning badge earned.':''}${r.firstCorrect===12?'<br>Perfect Explorer badge — 12 out of 12!':''}</p></div>`:'<div class="prize-banner">Keep your LeviBucks and try a fresh set.<br><strong>Practice turns “not yet” into “I’ve got it.”</strong></div>'}<div class="finish-actions">${r.passed&&r.level<9?'<button class="btn" id="continueLevel">Next adventure →</button>':`<button class="btn" id="retryLevel">${r.passed?'Play again':'Try again →'}</button>`}<button class="btn outline" data-back="levels">Level map</button>${r.passed?'<button class="btn soft" data-back="trophies">See my trophy</button>':''}</div><p class="small muted" style="margin-top:22px">Times measure initial fact-solving, including second chances; feedback pauses are excluded.<br>Your LeviBucks balance always stops at zero.</p></section>`;}

function renderTrophies(){const id=selectedModule,p=save.modules[id],m=modules[id];return`<div class="page-heading"><span class="eyebrow muted">Proof of your superpowers</span><h1>The trophy case</h1><p>Every trophy tells a story: “I kept going, and I got it.”</p></div><div class="tabs" aria-label="Choose a module">${moduleIds.map(x=>`<button data-tab="${x}" class="${x===id?'selected':''}">${modules[x].symbol} ${modules[x].name}</button>`).join('')}</div><div class="row between"><h2 style="font-size:23px">${m.name} treasures</h2><span class="pill">${mastery(id)} / 10 earned</span></div><div class="trophy-grid">${m.names.map((n,i)=>{const done=p.completed.includes(i);return`<article class="trophy ${done?'':'locked'}">${trophySVG(i,!done)}<h3>${tier(i)} ${n}</h3><span class="small muted">${done?'Mastered · Level '+(i+1):'Master level '+(i+1)}</span></article>`;}).join('')}</div><h2 style="font-size:23px">Little legends, big badges</h2><div class="badges">${[['streak5','✦ High-five streak','5 correct in a row'],['streak10','✦ Tenacious ten','10 correct in a row'],['perfect','✧ Perfect explorer','12 first-try wins'],['speed','ϟ Lightning record','Master a speed level']].map(([k,t,d])=>`<div class="badge ${p.badges.includes(k)?'':'locked'}">${t}<div class="small" style="font-weight:400;margin-top:6px">${p.badges.includes(k)?'Earned!':d}</div></div>`).join('')}</div>${moduleStats(id)}${weakest(id)}`;}
function renderEditor(){const t=save.tutor;return`<div class="page-heading"><span class="eyebrow muted">Made for your adventure</span><h1>Meet your sidekick.</h1><p>A wise owl? A silly slime? Your tutor, your imagination.<br>Changes save instantly. Your companion is the live preview.</p></div><div class="editor-card"><label class="field-label" for="tutorNameInput">01 / A name with character</label><input class="text-field" id="tutorNameInput" maxlength="20" value="${esc(t.name)}" placeholder="Pip"><p class="small muted" style="margin-top:8px">Up to 20 letters of pure personality.</p></div><div class="editor-card"><div class="field-label">02 / Choose a creature</div><div class="shape-grid">${shapes.map(s=>`<button class="shape-button ${s===t.shape?'selected':''}" data-shape="${s}" aria-pressed="${s===t.shape}">${avatar({...t,shape:s,hat:'',glasses:false,cape:false})}${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div></div><div class="editor-card"><div class="field-label">03 / A splash of color</div><div class="color-row">${colors.map((c,i)=>`<button class="color-button ${t.color===c?'selected':''}" data-color="${c}" style="background:${c}" aria-label="${['Mint','Lavender','Peach','Sky','Rose','Lime','Gold','Periwinkle'][i]}" aria-pressed="${t.color===c}"></button>`).join('')}</div></div><div class="editor-card"><div class="field-label">04 / Pick a personality</div><div class="personality-grid">${Object.entries(personalities).map(([id,p])=>`<button class="personality ${id===t.personality?'selected':''}" data-personality="${id}" aria-pressed="${id===t.personality}"><strong>${p.label}</strong><span>${p.desc}</span></button>`).join('')}</div></div>${voiceEditor()}<div class="editor-card"><div class="row between wrap"><div><h3>Dress for success.</h3><p class="small muted" style="margin-top:8px">Hats, capes, and magical places await.</p></div><button class="btn soft" data-back="shop">Visit prize shop ↗</button></div></div>`;}
function shopVisual(item){if(item.type==='hat')return`<svg viewBox="0 0 200 100" aria-hidden="true">${accessories({hat:item.id})}</svg>`;if(item.type==='glasses')return`<svg viewBox="0 0 200 130" aria-hidden="true">${accessories({glasses:true})}</svg>`;if(item.type==='cape')return'<svg viewBox="0 0 140 110" aria-hidden="true"><path d="M48 20 22 98q48-20 96 0L92 20z" fill="#a686ce" stroke="#665085" stroke-width="3"/><path d="M48 20q22 15 44 0" fill="none" stroke="#e5cc78" stroke-width="7"/><path d="m70 43 5 12 13 2-10 9 3 14-11-7-11 7 3-14-10-9 13-2z" fill="#e9d885"/></svg>';return`<svg viewBox="0 0 140 100" aria-hidden="true"><rect x="3" y="3" width="134" height="94" rx="15" fill="${item.id==='bg-space'?'#294e66':item.id==='bg-sunset'?'#efba9e':'#b0d3a0'}"/>${item.id==='bg-space'?'<circle cx="85" cy="48" r="24" fill="#d8f578"/><path d="m35 24 3 6 6 2-6 3-3 6-2-6-7-3 7-2z" fill="#b8a2e8"/><circle cx="34" cy="76" r="3" fill="white"/>':item.id==='bg-sunset'?'<circle cx="72" cy="54" r="25" fill="#ffe18e"/><path d="M3 76q30-25 65 0t69-5v26H3" fill="#d58f8d"/>':'<path d="m35 18-22 45h44zm63 4L70 77h56z" fill="#639b68"/><path d="M35 62v22m63-7v12" stroke="#446f53" stroke-width="7"/>'}</svg>`;}
function isEquipped(item){const t=save.tutor;return item.type==='hat'?t.hat===item.id:item.type==='background'?t.background===item.id:!!t[item.type];}
function renderShop(){return`<div class="page-heading"><span class="eyebrow muted">You earned it. Make it yours.</span><h1>The prize shop</h1><p>Spend your LeviBucks on a little extra awesome.<br>Just pretend money. No real purchases. Every creature is always free.</p></div><div class="rule">Your gear works on every tutor. Buy it once, keep it forever.<br>Tap an equipped item to take it off.</div><div class="shop-grid">${shopItems.map(item=>{const owned=save.purchases.includes(item.id),equipped=isEquipped(item);return`<article class="shop-card"><div class="shop-art">${shopVisual(item)}</div><h3>${item.name}</h3><p class="small muted" style="margin-top:8px;min-height:40px">${item.desc}</p><button class="btn ${equipped?'soft':owned?'outline':''}" data-buy="${item.id}" ${!owned&&save.balance<item.price?'disabled':''}>${equipped?'✓ Equipped · remove':owned?'Wear it →':item.price+' LeviBucks · buy'}</button>${!owned&&save.balance<item.price?`<p class="small muted" style="margin-top:8px;text-align:center">${item.price-save.balance} more LeviBucks to go</p>`:''}</article>`;}).join('')}</div>`;}
function buy(id){const item=shopItems.find(x=>x.id===id);if(!item)return;const owned=save.purchases.includes(id);if(!owned){if(save.balance<item.price)return;save.purchases.push(id);money(-item.price);toast(item.name+' is yours forever!');}const t=save.tutor,on=isEquipped(item);if(item.type==='hat')t.hat=on?'':id;else if(item.type==='background')t.background=on?'':id;else t[item.type]=!on;persist();updateTutor();show('shop');if(!owned)chatter('shop',{item:item.name},'success');else say(`${item.name} ${on?'removed':'equipped'}. Your look is saved.`,'',false);}
function editTutor(key,value){save.tutor[key]=value;persist();updateTutor();const y=scrollY;show('editor');window.scrollTo(0,y);if(key==='personality')chatter('greeting',{},'success');}
function bindScreen(){document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{show('levels',b.dataset.world);say(line('greeting')+' Welcome to the '+modules[b.dataset.world].world+'.');});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>navigate(b.dataset.back));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.level)));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show('trophies',b.dataset.tab));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));
if(screen==='play'){$('#answerForm').onsubmit=e=>{e.preventDefault();submitAnswer();};$('#answer').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,3);document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(game.locked)return;const el=$('#answer'),k=b.dataset.key;if(k==='clear')el.value='';else if(k==='back')el.value=el.value.slice(0,-1);else el.value=(el.value+k).slice(0,3);});$('#exitLevel').onclick=()=>navigate('levels');$('#nextQuestion').onclick=nextQuestion;$('#listenBtn').onclick=startListening;}
if(screen==='finish'){$('#continueLevel')?.addEventListener('click',()=>startLevel(lastResult.level+1));$('#retryLevel')?.addEventListener('click',()=>startLevel(lastResult.level));}
if(screen==='editor'){bindVoiceEditor();$('#tutorNameInput').oninput=e=>{save.tutor.name=e.target.value.trim().slice(0,20)||'Pip';persist();$('#tutorName').textContent=save.tutor.name;};document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>editTutor('shape',b.dataset.shape));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>editTutor('color',b.dataset.color));document.querySelectorAll('[data-personality]').forEach(b=>b.onclick=()=>editTutor('personality',b.dataset.personality));}}

function modal(html){$('#modalRoot').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</section></div>`;setTimeout(()=>$('.modal input,.modal button')?.focus(),0);}
function closeModal(){$('#modalRoot').innerHTML='';$('#settingsBtn').focus();}
function confirmModal(title,text,yes,label='Confirm'){modal(`<div class="eyebrow muted">A quick check</div><h2 id="modalTitle">${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button class="btn outline" id="cancelConfirm">Stay here</button><button class="btn" id="yesConfirm">${esc(label)}</button></div>`);$('#cancelConfirm').onclick=closeModal;$('#yesConfirm').onclick=()=>{closeModal();yes();};}
function firstLaunch(){modal(`<div class="brand-mark">✦</div><h2 id="modalTitle">Your adventure starts here.</h2><p>Twelve little facts. Big “I did it!” energy. What should your tutor call you?</p><form id="nameForm"><label class="field-label" for="playerName">Explorer’s first name or nickname</label><input class="text-field" id="playerName" maxlength="20" placeholder="Levi" autocomplete="off"><button class="btn" type="submit">Let’s go exploring →</button></form><p class="small" style="margin:15px 0 0">No account needed. Your quest saves only in this browser. Optional speech features are handled by your browser.</p>`);$('#nameForm').onsubmit=e=>{e.preventDefault();save.name=$('#playerName').value.trim().slice(0,20)||'Levi';persist();closeModal();show('home');chatter('greeting',{},'success');};}
function settings(){modal(`<div class="row between"><span class="eyebrow muted">Grown-up corner</span><button class="icon-btn" id="closeSettings" aria-label="Close settings">×</button></div><h2 id="modalTitle">Quest settings</h2><div class="settings-option"><label class="field-label" for="renamePlayer">Explorer name</label><input class="text-field" id="renamePlayer" maxlength="20" value="${esc(save.name)}"><button class="btn soft" id="saveName">Save name</button></div><div class="settings-option"><label class="row between" for="soundSetting"><strong>Celebration sounds</strong><input type="checkbox" id="soundSetting" ${save.sound?'checked':''}></label><p class="small" style="margin:10px 0 0">Soft, device-generated tones. Tutor voice has its own toggle.</p></div><div class="settings-option"><p class="small" style="margin:0"><strong>How mastery works</strong><br>10 of 12 initial facts correct on the first try (83% or better). A wrong-twice fact returns until solved. A second chance earns +1, but does not count toward mastery. The first 8 levels are untimed; speed levels allow 120 then 90 seconds, including manual feedback pauses. The short automatic pause after a correct answer does not use the countdown. A timeout means retry.<br><br>Stats count initial facts; solving time includes second chances but not between-fact feedback. Leaving a level saves resolved-fact stats and money, not unfinished level progress.<br><br>Progress lives only in this browser profile and file location. Private browsing or clearing browser data may erase it. Speech features depend on your browser; voice input may use an online service and need microphone permission. No sign-in, real purchases, ads, or tracking.</p></div><div class="settings-option"><button class="btn danger" id="resetGame">Reset all progress</button><p class="small" style="margin:10px 0 0">Clears this game’s name, LeviBucks, trophies, and tutor gear.</p></div>`);$('#closeSettings').onclick=closeModal;$('#saveName').onclick=()=>{save.name=$('#renamePlayer').value.trim().slice(0,20)||'Levi';persist();show(screen);toast('Explorer name saved.');closeModal();};$('#soundSetting').onchange=e=>{save.sound=e.target.checked;persist();};$('#resetGame').onclick=()=>confirmModal('Start a brand-new quest?','This permanently clears all progress, LeviBucks, purchases, and tutor designs in this browser.',()=>{leavePlay();save=fresh();persist();updateTutor();show('home');firstLaunch();},'Reset everything');}
// Deliberately never auto-submit speech: the child can check what was heard.
function spokenNumber(text){text=text.toLowerCase().replace(/[^a-z0-9\s-]/g,' ').replace(/-/g,' ').replace(/\b(the answer is|answer|equals|is|and)\b/g,' ').trim().replace(/\s+/g,' ');if(/^\d{1,3}$/.test(text))return Number(text);const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],tens=['twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];if(text==='oh')return 0;let words=text.split(' '),base=0;if(words[1]==='hundred'&&ones.indexOf(words[0])>0&&ones.indexOf(words[0])<10){base=ones.indexOf(words[0])*100;words=words.slice(2);if(!words.length)return base;}const rest=words.join(' '),n=ones.indexOf(rest);if(n>=0)return base+n;const t=tens.indexOf(words[0]);if(t>=0&&(words.length===1||words.length===2&&ones.indexOf(words[1])>0&&ones.indexOf(words[1])<10))return base+(t+2)*10+(words.length===2?ones.indexOf(words[1]):0);return null;}
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function updateMicUI(){const b=$('#listenBtn');if(b){b.classList.toggle('hidden',!save.mic||!SpeechRecognition);b.disabled=!!game?.locked;b.textContent=listening?'Listening… tap to stop':'◎ Speak my answer';}}
function stopListening(){if(recognition){recognition.onresult=null;try{recognition.abort();}catch(e){}}recognition=null;listening=false;updateMicUI();}
function startListening(){if(!SpeechRecognition||!game||game.locked)return;if(listening){stopListening();return;}try{cancelSpeech();recognition=new SpeechRecognition();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const n=spokenNumber(e.results[0][0].transcript);if(n===null){toast('I didn’t catch a number. Try again or type it.');return;}if(game&&!game.locked&&!game.finished){$('#answer').value=n;toast('Heard '+n+' — check it, then press Check.');}};recognition.onerror=e=>{if(e.error==='aborted')return;toast(e.error==='not-allowed'?'Microphone permission is off. You can still type.':'Voice input isn’t available right now. Try typing.');};recognition.onend=()=>{listening=false;updateMicUI();};recognition.start();listening=true;updateMicUI();}catch(e){listening=false;toast('Voice input isn’t available. Typing works everywhere.');updateMicUI();}}
function init(){if(!SpeechRecognition)save.mic=false;if(!window.speechSynthesis)save.voice=false;persist();initializeVoices();updateTutor();show('home');if(save.name)chatter('greeting',{},'',false);$('#micToggle').disabled=!SpeechRecognition;$('#voiceToggle').disabled=!window.speechSynthesis;$('#voiceNote').textContent=SpeechRecognition?'Experimental mic: permission + internet may be needed. Check what was heard before submitting.':'Voice answers are unavailable in this browser (experimental, mainly Chrome / Edge). Typing always works.';if(!window.speechSynthesis)$('#voiceNote').textContent+=' Tutor speech is unavailable here.';document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));$('#settingsBtn').onclick=()=>{if(game&&!game.finished){toast('Finish or leave your level before opening parent settings.');return;}settings();};$('#voiceToggle').onclick=()=>{save.voice=!save.voice;persist();updateTutor();if(!save.voice)cancelSpeech();else if(save.voice)speak(currentBubble||'Voice is on! Let’s go exploring.');};$('#micToggle').onclick=()=>{save.mic=!save.mic;persist();updateTutor();updateMicUI();if(!save.mic)stopListening();};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&game?.locked&&!game.finished&&!$('#modalRoot').innerHTML){e.preventDefault();nextQuestion();}if(e.key==='Escape'&&$('#modalRoot').innerHTML&&!$('#nameForm'))closeModal();if(e.key==='Tab'&&$('#modalRoot').innerHTML){const items=[...document.querySelectorAll('.modal button:not(:disabled),.modal input')],a=items[0],b=items[items.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}});if(!save.name)firstLaunch();}
init();
</script></body></html>
